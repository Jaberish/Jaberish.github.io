<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Snack Attack · HutStacks</title>
<link rel="icon" href="icon.png">
<style>
:root { --bg: #fbf6ee; --card: #fff; --text: #2a2340; --muted: #6b6480; --accent: #c2367a; --line: #eadfd0; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1730; --card: #242040; --text: #f2edf8; --muted: #b3abc9; --accent: #ff8ccf; --line: #3a3460; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
header img { width: 56px; height: 56px; border-radius: 13px; }
header a { color: inherit; text-decoration: none; font-weight: 700; font-size: 20px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 14px; letter-spacing: .08em; color: var(--accent); margin: 32px 0 8px; }
.updated, footer { color: var(--muted); font-size: 15px; }
a { color: var(--accent); overflow-wrap: anywhere; }
ul { padding-left: 22px; }
li { margin: 6px 0; }
.links { display: grid; gap: 12px; margin: 28px 0; padding: 0; list-style: none; }
.links a { display: block; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; font-weight: 600; }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
<header><img src="icon.png" alt=""><a href="">Midnight Snack Attack</a></header>
<h1>Midnight Snack Attack</h1>
<p>30+ snack-sized minigames for up to four players on the same Wi-Fi, or solo against the bots. For Android, iPhone and iPad.</p>
<ul class="links">
<li><a href="support/">Support</a></li>
<li><a href="privacy/">Privacy Policy</a></li>
</ul>
<footer>Made by HutStacks · <a href="mailto:hutkutter@gmail.com">hutkutter@gmail.com</a></footer>
</main>
</body>
</html>
